name: Deploy to AWS Elastic Beanstalk

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout code from GitHub
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Create deployment package with CORRECT structure
      # Files must be at ROOT of zip, not in a subfolder!
      - name: Create deployment package
        run: |
          # Create zip with files at root level (critical!)
          zip -r deploy.zip . \
            -x "*.git/*" \
            -x "*.github/*" \
            -x "node_modules/*" \
            -x ".cache/*" \
            -x "dist/*" \
            -x "*.log" \
            -x ".npm/*" \
            -x ".platform/*" \
            -x ".local/*" \
            -x ".config/*" \
            -x ".upm/*" \
            -x ".pythonlibs/*" \
            -x "__pycache__/*" \
            -x "venv/*"
          
          # Verify Procfile is in the zip
          echo "Checking zip contents..."
          unzip -l deploy.zip | grep -E "Procfile|package.json|.ebextensions" || echo "WARNING: Critical files might be missing!"

      # Step 3: Get current timestamp for version label
      - name: Generate version label
        id: version
        run: echo "label=deploy-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

      # Step 4: Deploy to AWS Elastic Beanstalk
      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: easy-pass
          environment_name: myeasypass-prod
          version_label: ${{ steps.version.outputs.label }}
          region: us-east-2
          deployment_package: deploy.zip
          wait_for_deployment: true
          wait_for_environment_recovery: 300

      # Step 5: Output deployment info
      - name: Deployment complete
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "🚀 Version: ${{ steps.version.outputs.label }}"
          echo "🌐 URL: http://myeasypass-prod.us-east-2.elasticbeanstalk.com"
          echo ""
          echo "⏰ Note: Application may take 2-3 minutes to fully start"

      # Step 6: Show error info if deployment fails
      - name: Deployment failed
        if: failure()
        run: |
          echo "❌ Deployment failed"
          echo "📋 Check AWS Elastic Beanstalk console for detailed logs"
          echo "🔗 https://console.aws.amazon.com/elasticbeanstalk/"
          Fix: Update deployment workflow
